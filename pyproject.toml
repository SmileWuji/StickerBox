[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sticker-box"
version = "0.1.0"
description = "A directory of images with a SQLite index, a generated manual and an enforced policy, kept by AI agents and readable by humans"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SmileWuji", email = "xiaomeikongwuji@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.8",
  "pillow>=11.0",
  "rapidocr-onnxruntime>=1.3",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
sticker-box = "sticker_box.cli:main"

[tool.setuptools.packages.find]
include = ["sticker_box*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["private: needs the owner's private corpora under testdata/private"]
